name: Auto Commit

on:
  schedule:
    # Runs at 00:00, 06:00, 12:00, and 18:00 UTC every day
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:  # Allows manual triggering from the Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make changes (update timestamp file)
        run: |
          echo "Last automated commit: $(date -u)" > activity.log
          # You can also modify any other file or create new ones

      - name: Commit and push changes
        env:
          # Use the built-in GITHUB_TOKEN (no need to create a secret manually)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "developerMonuar"
          git config --global user.email "developermonuar@gmail.com"
          git add activity.log
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated commit $(date -u)"
          git push
